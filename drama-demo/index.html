<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>短劇嵌入組件 · 示範</title>
<style>
  html,body{margin:0;min-height:100%;background:#fff}
  /* 側欄模式用的容器：模擬網站主頁面上留給組件的位置 */
  #dj-player{position:fixed;top:24px;right:24px;width:380px;height:min(660px,calc(100vh - 48px))}
  @media (max-width:899px){ #dj-player{display:none} }
</style>
</head>
<body>
<div id="dj-player"></div>
<script>
  // 網址 # 切換模式：（無）側欄 / #float 浮動按鈕 / #autoplay 進站自動播放小窗 / #single 單劇
  (function () {
    var mode = location.hash.replace('#', '');
    addEventListener('hashchange', function () { location.reload(); });
    var s = document.createElement('script');
    s.src = 'widget/v1.js'; s.async = true;
    s.setAttribute('data-site', 'demo');
    s.setAttribute('data-accent', '#7c5cff');
    if (mode === 'float') s.setAttribute('data-layout', 'float');
    if (mode === 'autoplay') { s.setAttribute('data-autoplay', 'muted'); s.setAttribute('data-cooldown', '0.01'); }
    if (mode === 'single') s.setAttribute('data-series', 'BUui7mO0ShA');
    if (mode === 'float' || mode === 'autoplay') document.getElementById('dj-player').style.display = 'none';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
